<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" fill="none">
  <text x="2" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="white" letter-spacing="-1">SoFi</text>
  <!-- 3x3 circle grid (official SoFi brand mark) -->
  <!-- Row 1: solid solid solid -->
  <circle cx="112" cy="8"  r="5" fill="white"/>
  <circle cx="125" cy="8"  r="5" fill="white"/>
  <circle cx="138" cy="8"  r="5" fill="white"/>
  <!-- Row 2: solid hollow hollow -->
  <circle cx="112" cy="21" r="5" fill="white"/>
  <circle cx="125" cy="21" r="5" fill="none" stroke="white" stroke-width="1.5"/>
  <circle cx="138" cy="21" r="5" fill="none" stroke="white" stroke-width="1.5"/>
  <!-- Row 3: solid solid hollow -->
  <circle cx="112" cy="34" r="5" fill="white"/>
  <circle cx="125" cy="34" r="5" fill="white"/>
  <circle cx="138" cy="34" r="5" fill="none" stroke="white" stroke-width="1.5"/>
</svg>
